id: enterprise-ai
name: 企业 AI 落地
account_tone: personal-ip
target_audience: 30-200 人成长型公司的创始人 / CEO / 一号位
content_logic: 70% 干货 + 20% 真实案例 + 10% 个人思考与价值观
platforms:
  - 公众号
  - 知乎
  - LinkedIn
default_content_type: deep-dive
style_notes: |
  第一人称视角，展示真实项目经历和踩坑记录。
  避免过于书面化，语气专业但有温度。
  每个新概念必须用人话解释，英文缩写尽量少用。
  每篇文章最多 3 句加粗金句，且句式要错开。
  结尾尽量给出可执行的清单、框架或问题集。
